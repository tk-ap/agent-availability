<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Control</title><style>:root{--g:#f4c95d;--w:#f8f4e9;--m:#858177;--b:#030303;--l:#ffffff12}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 35%,#f4c95d0d,transparent 35%),var(--b);color:var(--w);font:14px system-ui;min-height:100vh}button,input{font:inherit}button{background:#0b0b09cc;color:#bbb;border:1px solid var(--l);border-radius:999px;padding:10px 14px;cursor:pointer}button:hover{border-color:#f4c95d55;color:var(--w)}.top{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--l);background:#030303aa;backdrop-filter:blur(15px);position:sticky;top:0;z-index:5}.brand{font-weight:950;letter-spacing:.22em}.brand span,.ey{color:var(--g)}.stage{font-size:9px;letter-spacing:.18em;color:var(--m)}.hero{width:min(820px,90vw);margin:13vh auto;text-align:center}.hero .ey{font-size:9px;letter-spacing:.3em;text-transform:uppercase;font-weight:900}.hero h1{font-size:clamp(48px,7vw,92px);line-height:.85;letter-spacing:-.08em;margin:16px 0}.hero h1 span{color:#ffe8a3}.hero p{max-width:650px;margin:auto;color:var(--m);font-size:12px;line-height:1.7}.discover{display:flex;max-width:620px;margin:32px auto 22px;padding:6px;border:1px solid #f4c95d44;background:#080807cc;border-radius:999px}.discover input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--w);padding:12px 16px}.discover button,.primary{background:var(--g);color:#171207;font-weight:950;border-color:var(--g)}.loop{display:flex;justify-content:center;gap:12px;align-items:center;color:#777;font-size:8px;letter-spacing:.12em}.loop b{color:#aaa}.loop i{color:var(--g);font-style:normal}.scan,.content{width:min(1050px,92vw);margin:10vh auto;padding-bottom:70px}.scan{text-align:center}.scan h1,.content h1{font-size:clamp(40px,6vw,72px);letter-spacing:-.07em;margin:10px 0}.scan p,.content>p{color:var(--m);font-size:11px}.scanner{height:5px;background:#26241f;border-radius:99px;overflow:hidden;max-width:680px;margin:40px auto 18px}.scanner div{height:100%;width:70%;background:var(--g);animation:scan 1.6s ease-in-out infinite}@keyframes scan{0%{transform:translateX(-100%)}100%{transform:translateX(150%)}}.scan-status{font-size:9px;color:#777}.profile-head{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--l);padding-bottom:24px;margin-bottom:18px}.profile-head h1{margin:0}.profile-head p{color:#777}.confidence{text-align:right}.confidence strong{display:block;font-size:38px;color:#ffe8a3}.confidence small,label{font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:var(--m)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.grid article,.claim,.unknowns,.recommend,.result{border:1px solid var(--l);background:#080807c4;border-radius:15px;padding:18px}.grid h2{font-size:22px;margin:10px 0}.grid small,.claim small{color:#777}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.chip{border-radius:9px;padding:8px 10px}.chip.on{border-color:#f4c95d66;color:#ffe8a3;background:#f4c95d0d}.unknown{color:#777;font-size:10px}.evidence{margin-top:12px;font-size:9px;color:#999;line-height:1.8}.evidence a{display:block;color:#aaa}.unknowns{margin-top:12px}.unknowns>div,.unknowns span{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.unknowns span{border:1px solid #f4c95d22;color:#c5a95f;border-radius:99px;padding:5px 8px;font-size:8px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.verify>p{max-width:650px}.claim{margin:12px 0;display:grid;grid-template-columns:1fr 1fr auto;gap:18px;align-items:center}.claim h2{margin:7px 0;font-size:18px}.claim-actions{display:flex;gap:6px}.claim-actions button.selected{background:#f4c95d18;border-color:#f4c95d66;color:#ffe8a3}.result{display:grid;grid-template-columns:.7fr 1.3fr;gap:30px;margin:25px 0}.result strong{display:block;font-size:100px;line-height:.8;color:#ffe8a3}.result small{color:#777}.recommend{margin-top:12px;border-color:#f4c95d44;background:#f4c95d08}.recommend h2{font-size:25px;margin:8px 0}.recommend p{color:#999;font-size:10px;line-height:1.6}@media(max-width:750px){.loop{flex-wrap:wrap}.grid,.result{grid-template-columns:1fr}.claim{grid-template-columns:1fr}.profile-head{align-items:start;gap:15px}.discover{border-radius:15px}.discover input{width:100%}.discover button{white-space:nowrap}}
</style></head><body><div id="app"></div><script src="/control.js"></script></body></html>
